# Render Blueprint - Deneme Takip
# Render Dashboard > New > Blueprint > bu repo'yu seç > Apply
# Mevcut servisler isimleri eşleştiği için otomatik olarak bu blueprint'e bağlanır.
#
# ÜCRETSİZ NOTLAR:
# - Free PostgreSQL 30 gün sonra silinir (Render e-posta ile uyarır).
#   Silinirse: yeni free DB oluşturup DATABASE_URL'i güncellemek yeterli.
# - Free web servisleri 15 dk hareketsizlikte uyur; ilk açılış ~50 sn sürebilir.

databases:
  - name: deneme-takip-db
    plan: free
    databaseName: deneme_takip
    user: deneme_takip

services:
  # ============================================
  # BACKEND - FastAPI (Python)
  # URL: https://deneme-takip-yusuferen.onrender.com
  # ============================================
  - type: web
    name: deneme-takip-yusuferen
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deneme-takip-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://deneme-takip-yusuferen-1.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"

  # ============================================
  # FRONTEND - React/Vite (Statik Site)
  # URL: https://deneme-takip-yusuferen-1.onrender.com
  # ============================================
  - type: web
    name: deneme-takip-yusuferen-1
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://deneme-takip-yusuferen.onrender.com/api"
