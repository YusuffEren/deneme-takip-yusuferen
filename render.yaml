# Render Blueprint - Deneme Takip (YEDEK / alternatif senaryo)
#
# NOT: Ana kurulum artık Vercel (backend) + Neon (veritabanı) — bkz. KURULUM.md
# Bu dosya sadece backend'i Render'da çalıştırmak isterseniz diye duruyor.
#
# ÖNEMLİ: Render'ın ücretsiz PostgreSQL'i 30 gün sonra SİLİNİR.
# Bu yüzden veritabanı burada tanımlı DEĞİL; Neon'dan aldığınız
# DATABASE_URL'i Render Dashboard > Environment kısmına elle girin.
# Ayrıca ücretsiz Render servisleri 15 dk'da uyur (uyandırmak için
# UptimeRobot gibi bir servisle 5 dk'da bir /api/health pingletin).

services:
  # ============================================
  # BACKEND - FastAPI (Python)
  # URL: https://deneme-takip-yusuferen.onrender.com
  # ============================================
  - type: web
    name: deneme-takip-yusuferen
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false   # Neon bağlantı adresini Dashboard'dan girin
      - key: CORS_ORIGINS
        value: "https://deneme-takip-yusuferen-1.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.7"

  # ============================================
  # FRONTEND - React/Vite (Statik Site)
  # URL: https://deneme-takip-yusuferen-1.onrender.com
  # Statik siteler uyumaz, anında açılır.
  # ============================================
  - type: web
    name: deneme-takip-yusuferen-1
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # Vercel backend adresini Dashboard'dan girin
